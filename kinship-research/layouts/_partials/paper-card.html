{{ $a := .Params.authors }}<article class="entry is-curated" data-paper data-title="{{ .Title | lower }}" data-authors="{{ delimit $a " " | lower }}" data-topics="{{ delimit .Params.topics "|" | lower }}" data-year="{{ .Params.year }}" data-source="{{ .Params.source | lower }}" data-summary="{{ .Params.takeaway | default "" | lower }}">
  <div class="entry-mark">{{ .Params.year }}</div>
  <div class="entry-body">
    <h3 class="entry-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="entry-meta">{{ if gt (len $a) 4 }}{{ index $a 0 }} et al.{{ else }}{{ delimit $a ", " " and " }}.{{ end }} <em>{{ .Params.source }}</em><span class="status-label is-curated">Curated summary</span></p>
    {{ with .Params.takeaway }}<p class="entry-note">{{ . }}</p>{{ end }}
    <p class="entry-subjects">{{ delimit .Params.topics " · " }}</p>
  </div>
</article>
