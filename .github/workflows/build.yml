name: Validate and build dynasty_

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinship-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate curated research records
        run: python scripts/validate.py
      - name: Run offline metadata pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test seed and database export
        run: |
          python scripts/dynasty.py --db /tmp/dynasty-ci.sqlite seed
          python scripts/dynasty.py --db /tmp/dynasty-ci.sqlite export --site-root /tmp/dynasty-ci-site
          python -c "import json; from pathlib import Path; p=Path('/tmp/dynasty-ci-site/static/data/research-index.json'); assert len(json.loads(p.read_text()))==12"
      - name: Regenerate legacy paper pages
        run: python scripts/build_content.py
      - name: Ensure the existing site remains unchanged
        run: git diff --exit-code -- content/papers
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.2'
      - name: Build Hugo site
        run: hugo --minify

      - name: Verify complete paper index is present in generated website
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index=json.loads(Path("static/data/discovery-index.json").read_text(encoding="utf-8"))
          report=json.loads(Path("data/discovery-pilot-report.json").read_text(encoding="utf-8"))
          papers=Path("public/papers/index.html").read_text(encoding="utf-8")
          home=Path("public/index.html").read_text(encoding="utf-8")
          print("Papers count HTML:",papers[max(0,papers.find("discovery-total")-40):papers.find("discovery-total")+100])
          print("Homepage indexed count HTML:",home[max(0,home.find("INDEXED RESEARCH RECORDS")-100):home.find("INDEXED RESEARCH RECORDS")+100])
          total,pilot,feeds=report["total_displayed"],report["pilot_displayed"],report["pilot_source_count"]
          verified=json.loads(Path("registry/pilot23-verification.json").read_text(encoding="utf-8"))
          assert len(index)==total and total>=report["curated_displayed"]==12
          assert sum(r["review_status"]=="curated" for r in index)==12
          assert feeds==verified["source_count"], (feeds,verified["source_count"])
          assert 'discovery-results' in papers, "Papers page is still the 12-only archive"
          assert 'discovery-total' in papers and f'>{total}<' in papers, "Index count not rendered on Papers page"
          assert 'NEW PILOT CANDIDATES' in papers and f'>{pilot}<' in papers, "Pilot count missing from Papers page"
          assert 'INDEXED RESEARCH RECORDS' in home and f'>{total}<' in home, "Home still shows 12 as full collection"
          assert 'VERIFIED FEEDS' in home and f'>{feeds}<' in home, "Verified source count missing"
          print(f"Verified: all {total} records are indexed on the Papers page, with 12 curated and {feeds} active feeds.")
          PY
