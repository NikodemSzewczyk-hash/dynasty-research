name: Validate and build Kinship

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinship-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source records
        run: python scripts/validate.py
      - name: Regenerate paper pages
        run: python scripts/build_content.py
      - name: Ensure generated pages are current
        run: git diff --exit-code -- content/papers
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.2'
      - name: Build website
        run: hugo --minify
