name: Validate and build dynasty_

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinship-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate curated research records
        run: python scripts/validate.py
      - name: Run offline metadata pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test seed and database export
        run: |
          python scripts/dynasty.py --db /tmp/dynasty-ci.sqlite seed
          python scripts/dynasty.py --db /tmp/dynasty-ci.sqlite export --site-root /tmp/dynasty-ci-site
          python -c "import json; from pathlib import Path; p=Path('/tmp/dynasty-ci-site/static/data/research-index.json'); assert len(json.loads(p.read_text()))==12"
      - name: Regenerate legacy paper pages
        run: python scripts/build_content.py
      - name: Ensure the existing site remains unchanged
        run: git diff --exit-code -- content/papers
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.2'
      - name: Build Hugo site
        run: hugo --minify
